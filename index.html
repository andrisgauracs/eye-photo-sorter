<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eye Photo Sorter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Eye <em>in the browser</em></span>
      </div>
      <div class="status">
        <span id="backend" class="pill">loading…</span>
        <span id="model" class="pill muted">model: —</span>
      </div>
    </header>

    <main>
      <section id="drop" class="drop">
        <div class="drop-inner">
          <div class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>
          </div>
          <h1>Drop a folder of photos</h1>
          <p>Everything runs on this device with LiteRT.js. Nothing is uploaded.</p>
          <div class="drop-actions">
            <label class="btn">
              Choose folder
              <input id="pick-folder" type="file" webkitdirectory multiple hidden />
            </label>
            <label class="btn ghost">
              Choose files
              <input id="pick-files" type="file" accept="image/*" multiple hidden />
            </label>
          </div>
          <div id="load" class="load" hidden>
            <div class="bar"><span id="load-bar"></span></div>
            <span id="load-text">Downloading model…</span>
          </div>
        </div>
      </section>

      <section id="run" class="run" hidden>
        <div class="stats">
          <div class="stat">
            <span class="label">Photos</span>
            <span class="value"><b id="s-done">0</b><small id="s-total">/ 0</small></span>
          </div>
          <div class="stat">
            <span class="label">Elapsed</span>
            <span class="value"><b id="s-time">0.0</b><small>s</small></span>
          </div>
          <div class="stat accent">
            <span class="label">Throughput</span>
            <span class="value"><b id="s-rate">0</b><small>photos/s</small></span>
          </div>
          <div class="stat">
            <span class="label">Time per photo</span>
            <span class="value"><b id="s-ms">0</b><small>ms</small></span>
          </div>
        </div>
        <div class="progress"><span id="progress"></span></div>

        <div class="perf">
          <div class="card">
            <div class="card-head">
              <span class="label">Photos per second</span>
              <span id="peak" class="mono muted">peak —</span>
            </div>
            <canvas id="c-rate"></canvas>
          </div>
          <div class="card">
            <div class="card-head">
              <span class="label">Pipeline · <span id="lanes-n">0</span> photos in flight</span>
              <span class="legend"><i class="lg-decode"></i>decode <i class="lg-model"></i>Eye</span>
            </div>
            <canvas id="c-lanes"></canvas>
          </div>
        </div>

        <div id="meta" class="meta"></div>

        <div id="summary" class="summary" hidden></div>

        <nav id="chips" class="chips"></nav>

        <div id="view"></div>
      </section>
    </main>

    <aside id="detail" class="detail" hidden>
      <button id="detail-close" class="close" aria-label="Close">×</button>
      <img id="detail-img" alt="" />
      <div id="detail-body"></div>
    </aside>

    <div id="dropveil" class="dropveil" hidden><span>Drop to analyze</span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
